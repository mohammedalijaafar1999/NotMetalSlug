<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="IRON RUCKUS - an arcade run-and-gun shooter. Blast through six missions, rescue hostages, hijack tanks and topple the Rustcoat Legion." />
    <title>Iron Ruckus</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
      body { display: flex; align-items: center; justify-content: center; }
      #game { position: fixed; inset: 0; }
      #game canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
      #boot { color: #ffcc33; font: bold 14px monospace; letter-spacing: 2px; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">LOADING...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
